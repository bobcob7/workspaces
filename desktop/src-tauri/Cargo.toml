[package]
name = "ws-desktop"
version = "0.1.0"
description = "Desktop view of ws workspaces and their Claude Code agents"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ws_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "macros", "rt", "sync", "time"] }
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
