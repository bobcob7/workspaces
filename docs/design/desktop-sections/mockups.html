<!doctype html>
<!--
  Static mockups for the desktop app's sections (docs/design/desktop-sections).
  Open with a hash to pick a screen, e.g. mockups.html#repos. The screenshots
  in img/ are rendered from this file at 1280x800; see README.md.
  Colors and type match desktop/src/index.css and theme.ts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspaces mockups</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --panel: #161920;
  --panel-raised: #1d212a;
  --border: #2a2f3a;
  --text: #e3e6ec;
  --text-muted: #8d94a3;
  --accent: #58a6ff;
  --selected: #233047;
  --danger: #f85149;
  --status-working: #58a6ff;
  --status-needs-input: #f0a43a;
  --status-idle: #d8b04c;
  --status-done: #56c478;
  --status-stopped: #6e7681;
  --status-running: #a371f7;
  --font-mono: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.root { display: flex; flex-direction: column; height: 800px; width: 1280px; position: relative; }
.topBar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); min-height: 47px; }
.brand { font-weight: 700; font-size: 15px; }
.badge { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--status-needs-input) 18%, transparent); color: var(--status-needs-input); font-size: 12px; font-weight: 600; }
.spacer { flex: 1; }
.muted { color: var(--text-muted); font-size: 12px; }
.mono { font-family: var(--font-mono); }
.btn { border: 0; background: none; color: var(--accent); font: 600 13px/1 inherit; font-family: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.btn.outlined { border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding: 7px 10px; }
.btn.contained { background: var(--accent); color: #0b1220; }
.btn.danger { color: var(--danger); }
.btn.small { font-size: 12px; padding: 5px 8px; }
.body { flex: 1; display: flex; min-height: 0; }

/* Section rail */
.rail { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--border); background: var(--bg); }
.railItem { position: relative; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 7px; border-radius: 10px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
.railItem svg { width: 20px; height: 20px; }
.railItem.active { background: var(--selected); color: var(--text); }
.railItem.active::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.railCount { position: absolute; top: 3px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--status-needs-input); color: #1a1205; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.railCount.blue { background: var(--accent); color: #0b1220; }
.railSpacer { flex: 1; }

/* List pane */
.sidebar { width: 300px; flex: none; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.search { margin: 10px 12px 2px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 13px; background: var(--bg); }
.search svg { width: 14px; height: 14px; }
.list { overflow: hidden; padding: 8px 0 16px; }
.heading { display: flex; align-items: center; gap: 6px; margin: 0; padding: 8px 16px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.heading .count { font-weight: 500; opacity: 0.8; }
.group + .group { margin-top: 8px; }
.items { list-style: none; margin: 0; padding: 0 8px; }
.item { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 8px; }
.item.current { background: var(--selected); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.age { flex: none; color: var(--text-muted); font-size: 11px; }
.summary { padding-left: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); font-size: 12px; }
.summary.flush { padding-left: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--status-stopped); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.icon { width: 14px; height: 14px; flex: none; color: var(--text-muted); }
.icon.on { color: var(--accent); }

/* Detail pane */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.header { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.titleRow { display: flex; align-items: center; gap: 12px; }
.title { margin: 0; font-size: 18px; font-weight: 650; }
.title .prefix { color: var(--text-muted); font-weight: 500; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; color: var(--text-muted); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #2a303b; color: var(--text); font-size: 12px; }
.chip.link { background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.chip.warn { background: color-mix(in srgb, var(--status-needs-input) 18%, transparent); color: var(--status-needs-input); font-weight: 600; }
.chip.small { padding: 1px 6px; font-size: 11px; }
.content { flex: 1; overflow: hidden; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
.cardHead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
.cardBody { padding: 12px 14px; }
.toggleRow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.toggleRow + .toggleRow { border-top: 1px solid var(--border); }
.toggleText { flex: 1; }
.toggleText div:first-child { font-weight: 600; font-size: 13px; }
.switch { width: 34px; height: 20px; border-radius: 999px; background: #3a404c; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #c9ced8; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; background: #fff; }
.tabs { display: flex; align-items: center; gap: 4px; }
.tab { padding: 6px 10px; border-radius: 8px; color: var(--text-muted); font-weight: 600; font-size: 13px; }
.tab.active { background: var(--panel-raised); color: var(--text); }
.tab .n { opacity: 0.7; font-weight: 500; margin-left: 4px; }
.filter { margin-left: auto; width: 220px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 12px; background: var(--bg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
tr.hover td { background: var(--panel-raised); }
td.actions { text-align: right; }
.result { margin: 0; padding: 8px 10px; border-left: 3px solid var(--status-done); background: var(--panel-raised); border-radius: 0 6px 6px 0; }
.prose { color: var(--text); font-size: 13px; line-height: 1.55; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; }
.prose code { font-family: var(--font-mono); font-size: 12px; background: var(--panel-raised); padding: 1px 4px; border-radius: 4px; }
.cmd { font: 12px var(--font-mono); color: var(--text-muted); padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; }
.alert { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
.alert.info { background: color-mix(in srgb, var(--accent) 12%, transparent); color: #b9d8ff; }
.alert.warn { background: color-mix(in srgb, var(--status-needs-input) 14%, transparent); color: #f5cf95; }

/* Conversation stand-in for the Agents screen */
.convo { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.msg { max-width: 760px; font-size: 13px; line-height: 1.55; }
.msg.user { align-self: flex-end; background: var(--panel-raised); padding: 8px 12px; border-radius: 10px; }
.tool { font: 12px var(--font-mono); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: fit-content; }
.tool b { color: var(--text); }
.reply { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.reply .box { flex: 1; padding: 10px 12px; border: 1px solid #3a404c; border-radius: 8px; color: var(--text-muted); }

/* Dialog */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; }
.dialog { width: 600px; background: #1d212a; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.dialog h2 { margin: 0; padding: 18px 22px 6px; font-size: 18px; font-weight: 650; }
.dialog .dbody { padding: 10px 22px 6px; display: flex; flex-direction: column; gap: 16px; }
.dialog .dactions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; }
.field { position: relative; border: 1px solid #3a404c; border-radius: 8px; padding: 14px 12px 10px; font-size: 14px; }
.field label { position: absolute; top: -8px; left: 9px; padding: 0 4px; background: #1d212a; font-size: 12px; color: var(--text-muted); }
.field.focus { border: 2px solid var(--accent); }
.field.focus label { color: var(--accent); }
.field.multi { white-space: pre-wrap; line-height: 1.5; font-size: 13px; }
.fieldHint { margin-top: -10px; font-size: 12px; color: var(--text-muted); }
.fields { display: flex; gap: 12px; }
.fields .field { flex: 1; }

/* Settings */
.subnav { width: 220px; flex: none; border-right: 1px solid var(--border); background: var(--panel); padding: 12px 8px; }
.subnav .item { font-weight: 600; flex-direction: row; align-items: center; }
.settings { flex: 1; overflow: hidden; padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; max-width: 820px; }
.settings h1 { margin: 0; font-size: 20px; }
.setting { display: flex; gap: 24px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.setting .label { width: 260px; flex: none; }
.setting .label div:first-child { font-weight: 600; font-size: 13px; }
.setting .control { flex: 1; display: flex; align-items: center; gap: 10px; }
.input { padding: 7px 10px; border: 1px solid #3a404c; border-radius: 8px; font-size: 13px; background: var(--bg); }
.textarea { width: 100%; padding: 10px; border: 1px solid #3a404c; border-radius: 8px; font: 12px/1.55 var(--font-mono); background: var(--bg); white-space: pre-wrap; }
.check { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #6b7280; flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); position: relative; }
.check.on::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px; border: solid #0b1220; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.empty { flex: 1; display: grid; place-items: center; padding: 24px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const icons = {
  agents: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>',
  repos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6"/><path d="M18 10.2c0 4-6 3.5-11.2 7"/></svg>',
  reviews: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M6 7.2v9.6"/><path d="M18 16.8V9a3 3 0 0 0-3-3h-4"/><path d="M13 3.5 10.5 6 13 8.5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  eye: '<svg class="icon on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
  bolt: '<svg class="icon on" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
};

const rail = (active, counts = {}) => {
  const item = (key, label) => `
    <div class="railItem ${active === key ? "active" : ""}">
      ${icons[key]}<span>${label}</span>
      ${counts[key] ? `<span class="railCount ${key === "reviews" ? "blue" : ""}">${counts[key]}</span>` : ""}
    </div>`;
  return `<nav class="rail">${item("agents", "Agents")}${item("repos", "Repos")}${item("reviews", "Reviews")}<div class="railSpacer"></div>${item("settings", "Settings")}</nav>`;
};

let counts = { agents: 2, reviews: 3 };

const topBar = (actions) => `
  <header class="topBar">
    <span class="brand">Workspaces</span>
    <span class="badge">2 waiting for you</span>
    <span class="spacer"></span>
    ${actions}
  </header>`;

const dot = (color) => `<span class="dot" style="background:${color}"></span>`;

const listItem = ({ name, age, summary, color, current, trailing = "" }) => `
  <li class="item ${current ? "current" : ""}">
    <div class="row">${color ? dot(color) : ""}<span class="name">${name}</span>${trailing}<span class="age">${age}</span></div>
    <div class="summary ${color ? "" : "flush"}">${summary}</div>
  </li>`;

const group = (title, items) => `
  <div class="group">
    <h2 class="heading">${title} <span class="count">${items.length}</span></h2>
    <ul class="items">${items.map(listItem).join("")}</ul>
  </div>`;

const shell = (active, actions, sidebar, main, overlay = "") => `
  <div class="root">
    ${topBar(actions)}
    <div class="body">
      ${rail(active, counts)}
      ${sidebar}
      <main class="main">${main}</main>
    </div>
    ${overlay}
  </div>`;

/* ---------- Agents (unchanged section, now under the rail) ---------- */
const agentsScreen = () => shell(
  "agents",
  `<button class="btn">Restore stopped</button><button class="btn outlined">New shell</button><button class="btn contained">New agent</button>`,
  `<aside class="sidebar"><div class="list">
    ${group("Needs input", [
      { name: "fix-login", age: "2m ago", summary: "Asking to run the migration against staging", color: "var(--status-needs-input)" },
      { name: "release-notes", age: "9m ago", summary: "Waiting for the issue list", color: "var(--status-idle)" },
    ])}
    ${group("Working", [
      { name: "review-buff-bear-41-9c04e2a", age: "1m ago", summary: "Reading internal/webhook/retry.go", color: "var(--status-working)", current: true },
      { name: "api-client", age: "4m ago", summary: "Updating generated client for v2.1", color: "var(--status-working)" },
    ])}
    ${group("Done", [
      { name: "doer", age: "5h ago", summary: "PR #4: model pull with size and progress", color: "var(--status-done)" },
    ])}
    ${group("Shells", [
      { name: "api-bump", age: "2h ago", summary: "buff-bear@main, api@v2.1.0", color: "var(--status-running)" },
    ])}
  </div></aside>`,
  `<section class="header">
     <div class="titleRow"><h1 class="title">review-buff-bear-41-9c04e2a</h1><span class="status" style="color:var(--status-working)">${dot("var(--status-working)")}Working</span><span class="spacer"></span><button class="btn">Detach</button><button class="btn">Stop</button><button class="btn danger">Remove</button></div>
     <div class="meta"><span class="mono">…/workspaces/review-buff-bear-41-9c04e2a</span><span class="mono">session 7be1d0c2</span><span class="chip">buff-bear@9c04e2a</span><span class="chip link">Reviewing bobcob7/buff-bear#41</span></div>
   </section>
   <div class="convo">
     <div class="msg user">Review pull request bobcob7/buff-bear#41, "Retry webhooks with backoff", at 9c04e2a against main…</div>
     <div class="tool"><b>Bash</b>(git diff origin/main...HEAD --stat)</div>
     <div class="msg">Seven files changed. The core of it is <span class="mono">internal/webhook/retry.go</span>; I'll read it first, then the tests.</div>
     <div class="tool"><b>Read</b>(internal/webhook/retry.go)</div>
   </div>
   <div class="reply"><div class="box">Message the agent (Enter to send, Shift+Enter for a new line)</div><button class="btn">Send</button></div>`,
);

/* ---------- Repos ---------- */
const reposSidebar = (current = "buff-bear") => `
  <aside class="sidebar">
    <div class="search">${icons.search}Filter repos</div>
    <div class="list">
      ${group("github.com/bobcob7", [
        { name: "buff-bear", age: "3m ago", summary: "main · 14 branches · 2 workspaces", current: current === "buff-bear", trailing: icons.eye + icons.bolt },
        { name: "api", age: "3m ago", summary: "main · 6 branches · 1 workspace", trailing: icons.eye },
        { name: "doer", age: "1d ago", summary: "master · 3 branches · 2 workspaces" },
        { name: "other-repo", age: "6d ago", summary: "main · 2 branches" },
        { name: "workspaces", age: "3m ago", summary: "main · 9 branches · 3 workspaces", trailing: icons.eye },
      ])}
      ${group("github.com/rust-lang", [
        { name: "cargo", age: "2w ago", summary: "master · 41 branches · 412 MB" },
      ])}
      ${group("gitlab.example.com/team", [
        { name: "svc", age: "4h ago", summary: "main · 5 branches · 1 workspace" },
      ])}
    </div>
  </aside>`;

const branchRow = ([name, subject, author, age, ws, hover]) => `
  <tr class="${hover ? "hover" : ""}">
    <td style="width:26%" class="mono">${name}${name === "main" ? ' <span class="chip small">default</span>' : ""}</td>
    <td style="width:34%">${subject}</td>
    <td style="width:11%" class="muted">${author}</td>
    <td style="width:9%" class="muted">${age}</td>
    <td style="width:20%" class="actions">${hover ? '<button class="btn small">New agent</button><button class="btn small">New shell</button>' : ws.map((w) => `<span class="chip small">${w}</span>`).join(" ")}</td>
  </tr>`;

const reposScreen = (overlay = "") => shell(
  "repos",
  `<span class="muted">7 repos · 1.1 GB</span><button class="btn">Fetch all</button><button class="btn contained">Add repo</button>`,
  reposSidebar(),
  `<section class="header">
     <div class="titleRow"><h1 class="title"><span class="prefix">github.com/bobcob7/</span>buff-bear</h1><span class="spacer"></span><button class="btn">Fetch</button><button class="btn">New agent</button><button class="btn">New shell</button><button class="btn danger">Remove</button></div>
     <div class="meta"><span class="mono">https://github.com/bobcob7/buff-bear.git</span><span>·</span><span>default <span class="mono">main</span></span><span>·</span><span>18.4 MB</span><span>·</span><span>fetched 3m ago</span></div>
   </section>
   <div class="content">
     <div class="card">
       <div class="cardHead">Pull request reviews<span class="spacer"></span><span class="muted" style="font-weight:500">3 open · checked 1m ago</span><button class="btn small">Show in Reviews</button></div>
       <div class="toggleRow"><div class="toggleText"><div>Watch pull requests</div><div class="muted">Check this repo's open PRs every 5 minutes and list them in Reviews.</div></div><span class="switch on"></span></div>
       <div class="toggleRow"><div class="toggleText"><div>Review new pull requests automatically</div><div class="muted">Start a review agent for each new PR that matches your review rules in Settings.</div></div><span class="switch on"></span></div>
     </div>
     <div>
       <div class="tabs"><span class="tab active">Branches<span class="n">14</span></span><span class="tab">Tags<span class="n">6</span></span><span class="tab">Workspaces<span class="n">2</span></span><span class="filter">Filter branches</span></div>
       <table style="margin-top:8px">
         <thead><tr><th>Branch</th><th>Last commit</th><th>Author</th><th>Updated</th><th style="text-align:right">Workspaces</th></tr></thead>
         <tbody>
           ${[
             ["main", "Merge pull request #39 from bobcob7/fix/session-ttl", "bobcob7", "2h ago", ["api-bump"]],
             ["feat/rate-limit", "Add a token bucket per client IP", "alice", "3h ago", [], true],
             ["fix/login-empty-password", "Reject empty passwords before hashing", "bobcob7", "5h ago", ["fix-login"]],
             ["feat/webhook-retry", "Retry webhooks with exponential backoff", "dana", "1d ago", []],
             ["chore/deps", "Bump golang.org/x/crypto to v0.43.0", "renovate[bot]", "2d ago", []],
             ["feat/new-thing", "Sketch the new-thing API", "bobcob7", "6d ago", []],
             ["spike/grpc", "Try connect-go for the admin API", "carol", "3w ago", []],
           ].map(branchRow).join("")}
         </tbody>
       </table>
     </div>
   </div>`,
  overlay,
);

const addRepoDialog = () => `
  <div class="scrim"><div class="dialog">
    <h2>Add a repo to the cache</h2>
    <div class="dbody">
      <div class="field focus"><label>Repo spec or URL</label><span class="mono">bobcob7/payments</span></div>
      <div class="fieldHint"><span class="mono">github.com/bobcob7/payments</span> · found on github.com via <span class="mono">defaults.owners</span> · not cached yet</div>
      <div class="alert info">Cloning keeps a bare copy under the cache directory. Workspaces created from it start in under a second and work offline.</div>
      <div class="row" style="gap:10px"><span class="switch on"></span><span>Watch pull requests in Reviews</span></div>
    </div>
    <div class="dactions"><button class="btn">Cancel</button><button class="btn contained">Add repo</button></div>
  </div></div>`;

const removeRepoDialog = () => `
  <div class="scrim"><div class="dialog">
    <h2>Remove buff-bear from the cache?</h2>
    <div class="dbody">
      <div class="prose"><p>Deletes the cached copy at <code>…/cache/repos/github.com/bobcob7/buff-bear.git</code> (18.4 MB). The next workspace that needs it clones it again from upstream.</p>
      <p>Its 2 workspaces, <code>fix-login</code> and <code>api-bump</code>, keep working: their repos don't depend on the cache's copy.</p>
      <p>Pull requests for this repo stop being checked, and it's removed from Reviews.</p></div>
    </div>
    <div class="dactions"><button class="btn">Cancel</button><button class="btn contained" style="background:var(--danger);color:#fff">Remove</button></div>
  </div></div>`;

/* ---------- Reviews ---------- */
const reviewsSidebar = (current) => `
  <aside class="sidebar">
    <div class="search">${icons.search}Filter pull requests</div>
    <div class="list">
      ${group("To review", [
        { name: "#42 Add rate limiting to login", age: "3h ago", summary: "buff-bear · alice · review requested", color: "var(--status-needs-input)", current: current === 42 },
        { name: "#17 Paginate the audit log", age: "6h ago", summary: "api · carol", color: "var(--status-needs-input)" },
        { name: "#7 Release binaries with checksums", age: "1d ago", summary: "workspaces · bobcob7", color: "var(--status-needs-input)" },
      ])}
      ${group("Reviewing", [
        { name: "#41 Retry webhooks with backoff", age: "1m ago", summary: "buff-bear · dana · agent working", color: "var(--status-working)" },
      ])}
      ${group("Reviewed", [
        { name: "#38 Cache session lookups", age: "2h ago", summary: "buff-bear · alice · 2 new commits", color: "var(--status-idle)", current: current === 38 },
        { name: "#16 Drop the v1 endpoints", age: "1d ago", summary: "api · bobcob7 · 3 findings", color: "var(--status-done)" },
      ])}
      ${group("Dismissed", [
        { name: "#40 WIP: try sqlc", age: "2d ago", summary: "buff-bear · carol · draft", color: "var(--status-stopped)" },
      ])}
    </div>
  </aside>`;

const reviewsActions = `<span class="muted">3 repos watched · checked 1m ago</span><button class="btn">Check now</button><button class="btn outlined">Watched repos</button>`;

const reviewsScreen = (overlay = "") => shell(
  "reviews",
  reviewsActions,
  reviewsSidebar(42),
  `<section class="header">
     <div class="titleRow"><h1 class="title">Add rate limiting to login</h1><span class="status" style="color:var(--status-needs-input)">${dot("var(--status-needs-input)")}To review</span><span class="spacer"></span><button class="btn">Open on GitHub</button><button class="btn">Dismiss</button><button class="btn contained">Review</button></div>
     <div class="meta"><span class="chip link">bobcob7/buff-bear#42</span><span>alice opened 3h ago</span><span>·</span><span class="mono">feat/rate-limit → main</span><span>·</span><span class="mono">3f2a9c1</span><span>·</span><span><span style="color:var(--status-done)">+214</span> <span style="color:var(--danger)">−37</span> in 9 files</span><span class="chip warn">Review requested from you</span></div>
   </section>
   <div class="content">
     <div class="card"><div class="cardHead">Description</div><div class="cardBody prose">
       <p>Login has no rate limit, so a single client can try passwords as fast as it likes. This adds a token bucket per client IP in front of <code>POST /login</code>.</p>
       <ul><li>10 attempts per minute per IP, refilled continuously; configurable with <code>LOGIN_RATE</code>.</li><li>Over the limit answers <code>429</code> with <code>Retry-After</code>.</li><li>Buckets live in memory and are swept every 5 minutes.</li></ul>
       <p>Closes #35.</p>
     </div></div>
     <div class="card"><div class="cardHead">Review will run<span class="spacer"></span><button class="btn small">Edit before starting</button></div><div class="cardBody">
       <div class="cmd">ws claude --name review-buff-bear-42-3f2a9c1 github.com/bobcob7/buff-bear@3f2a9c1e… -- "Review pull request bobcob7/buff-bear#42…"</div>
       <div class="muted" style="margin-top:8px">A new workspace with the PR's head commit. The agent reports its findings here and in Agents; it doesn't comment on GitHub unless your prompt asks it to.</div>
     </div></div>
   </div>`,
  overlay,
);

const reviewedScreen = () => shell(
  "reviews",
  reviewsActions,
  reviewsSidebar(38),
  `<section class="header">
     <div class="titleRow"><h1 class="title">Cache session lookups</h1><span class="status" style="color:var(--status-done)">${dot("var(--status-done)")}Reviewed</span><span class="chip warn">2 new commits since review</span><span class="spacer"></span><button class="btn">Open on GitHub</button><button class="btn">Dismiss</button><button class="btn contained">Review again</button></div>
     <div class="meta"><span class="chip link">bobcob7/buff-bear#38</span><span>alice opened 2d ago, pushed 2h ago</span><span>·</span><span class="mono">feat/session-cache → main</span><span>·</span><span class="mono">e71b0d4</span><span>·</span><span><span style="color:var(--status-done)">+96</span> <span style="color:var(--danger)">−12</span> in 4 files</span></div>
   </section>
   <div class="content">
     <div class="card">
       <div class="cardHead">${dot("var(--status-done)")} review-buff-bear-38-a41c9f2<span class="muted" style="font-weight:500">reviewed a41c9f2 · 3h ago</span><span class="spacer"></span><button class="btn small">Open agent</button><button class="btn small danger">Remove</button></div>
       <div class="cardBody prose">
         <p class="result">Two problems worth fixing before merge, one nit.</p>
         <ul style="margin-top:10px">
           <li><b>Stale reads after logout.</b> <code>Logout</code> deletes the session row but not the cache entry, so the token keeps working for up to the 5-minute TTL (<code>session/cache.go:48</code>).</li>
           <li><b>Unbounded cache.</b> Entries are never evicted except by TTL; a burst of logins grows the map without limit. An LRU with a size cap would bound it.</li>
           <li><b>Nit.</b> <code>cacheTTL</code> is exported but only used inside the package.</li>
         </ul>
       </div>
     </div>
     <div class="alert warn">alice pushed 2 commits after this review: "Evict on logout" and "Cap the cache at 10k entries". Review again to check them.</div>
   </div>`,
);

const reviewDialog = () => `
  <div class="scrim"><div class="dialog" style="width:640px">
    <h2>Review bobcob7/buff-bear#42</h2>
    <div class="dbody">
      <div class="field"><label>Workspace name</label><span class="mono">review-buff-bear-42-3f2a9c1</span></div>
      <div class="field"><label>Repo</label><span class="chip">github.com/bobcob7/buff-bear@3f2a9c1</span> <span class="muted">PR head, detached</span></div>
      <div class="field focus multi"><label>Task</label>Review pull request bobcob7/buff-bear#42, "Add rate limiting to login", by alice, at 3f2a9c1 against main.
The PR's description is below. Check the diff against main for bugs, security problems, and missing tests. Report findings ranked by severity, with file and line. Don't push or comment on GitHub.
…</div>
      <div class="fields"><div class="field"><label>Model</label>Default</div><div class="field"><label>Permission mode</label>default</div></div>
    </div>
    <div class="dactions"><button class="btn">Cancel</button><button class="btn contained">Start review</button></div>
  </div></div>`;

const watchedDialog = () => `
  <div class="scrim"><div class="dialog" style="width:620px">
    <h2>Watched repos</h2>
    <div class="dbody" style="gap:0">
      <div class="muted" style="margin-bottom:10px">Open pull requests in watched repos are listed in Reviews. Auto-review starts an agent for each new one that matches your review rules.</div>
      <table>
        <thead><tr><th>Repo</th><th style="text-align:center">Watch</th><th style="text-align:center">Auto-review</th></tr></thead>
        <tbody>
          ${[["github.com/bobcob7/buff-bear", true, true], ["github.com/bobcob7/api", true, false], ["github.com/bobcob7/workspaces", true, false], ["github.com/bobcob7/doer", false, false], ["github.com/bobcob7/other-repo", false, false], ["github.com/rust-lang/cargo", false, false]].map(([id, w, a]) => `<tr><td class="mono" style="max-width:none">${id}</td><td style="text-align:center;max-width:none"><span class="switch ${w ? "on" : ""}" style="display:inline-block"></span></td><td style="text-align:center;max-width:none"><span class="switch ${a ? "on" : ""}" style="display:inline-block;${w ? "" : "opacity:.35"}"></span></td></tr>`).join("")}
          <tr><td class="mono muted" style="max-width:none">gitlab.example.com/team/svc</td><td colspan="2" class="muted" style="text-align:center;max-width:none">GitHub repos only</td></tr>
        </tbody>
      </table>
    </div>
    <div class="dactions"><button class="btn">Review rules…</button><span class="spacer"></span><button class="btn contained">Done</button></div>
  </div></div>`;

/* ---------- Settings ---------- */
const settingsScreen = () => `
  <div class="root">
    ${topBar("")}
    <div class="body">
      ${rail("settings", counts)}
      <aside class="subnav"><ul class="items" style="padding:0">
        <li class="item"><span class="name">General</span></li>
        <li class="item"><span class="name">Agents</span></li>
        <li class="item current"><span class="name">Reviews</span></li>
        <li class="item"><span class="name">About</span></li>
      </ul></aside>
      <main class="main"><div class="settings">
        <h1>Reviews</h1>
        <div class="setting"><div class="label"><div>Check for pull requests</div><div class="muted">How often watched repos are checked with <span class="mono">gh</span>.</div></div><div class="control"><span class="input">Every 5 minutes ▾</span></div></div>
        <div class="setting"><div class="label"><div>Auto-review only</div><div class="muted">Which new PRs in an auto-review repo start an agent.</div></div><div class="control" style="flex-direction:column;align-items:flex-start;gap:8px">
          <span class="row"><span class="check on"></span>Skip drafts</span>
          <span class="row"><span class="check on"></span>Skip pull requests I opened</span>
          <span class="row"><span class="check"></span>Only when my review is requested</span>
        </div></div>
        <div class="setting"><div class="label"><div>At most</div><div class="muted">Auto-reviews running at once; the rest wait.</div></div><div class="control"><span class="input">2</span><span class="muted">review agents</span></div></div>
        <div class="setting"><div class="label"><div>Review task</div><div class="muted">Sent to each review agent. <span class="mono">{repo}</span>, <span class="mono">{number}</span>, <span class="mono">{title}</span>, <span class="mono">{author}</span>, <span class="mono">{base}</span>, <span class="mono">{head}</span>, and <span class="mono">{body}</span> are filled in.</div></div><div class="control"><div class="textarea">Review pull request {repo}#{number}, "{title}", by {author}, at {head} against {base}.
The PR's description is below. Check the diff against {base} for bugs, security problems, and missing tests. Report findings ranked by severity, with file and line. Don't push or comment on GitHub.

{body}</div></div></div>
        <div class="setting"><div class="label"><div>Model and permission mode</div></div><div class="control"><span class="input">Default ▾</span><span class="input">default ▾</span></div></div>
      </div></main>
    </div>
  </div>`;

const reviewsEmptyScreen = () => (counts = { agents: 2 }) && shell(
  "reviews",
  `<span class="muted">No repos watched</span><button class="btn outlined">Watched repos</button>`,
  `<aside class="sidebar"><div class="list"><p class="muted" style="padding:16px;margin:0">No pull requests to show.</p></div></aside>`,
  `<div class="empty"><div style="max-width:420px">
     <div style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:8px">Watch a repo to see its pull requests here</div>
     <div>Reviews checks your watched GitHub repos for open pull requests and starts a review agent for any of them in one click.</div>
     <div style="margin-top:16px"><button class="btn contained">Choose repos to watch</button></div>
     <div class="alert warn" style="margin-top:20px;text-align:left"><span><span class="mono">gh</span> isn't signed in. Run <span class="mono">gh auth login</span> in a terminal, then Check now.</span></div>
   </div></div>`,
);

const screens = {
  agents: agentsScreen,
  repos: () => reposScreen(),
  "repos-add": () => reposScreen(addRepoDialog()),
  "repos-remove": () => reposScreen(removeRepoDialog()),
  reviews: () => reviewsScreen(),
  "reviews-start": () => reviewsScreen(reviewDialog()),
  "reviews-reviewed": reviewedScreen,
  "reviews-watched": () => reviewsScreen(watchedDialog()),
  "reviews-empty": reviewsEmptyScreen,
  settings: settingsScreen,
};

const render = () => {
  const key = location.hash.slice(1) || "repos";
  document.getElementById("app").innerHTML = (screens[key] ?? screens.repos)();
};
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
