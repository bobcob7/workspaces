# Build and smoke-test the Workspace Online image (ADR 0053) natively on
# linux/amd64, on the vega cluster. arm64 and amd64 run as two workflows so each
# builds on its own hardware, with no QEMU (rustc crashes under it).
#
# Needs the repo marked Trusted in Woodpecker (privileged DinD + a PVC volume),
# and the agent for this platform (argocd/apps/woodpecker.yaml in vega-infra).
#
# NEVER add a pull_request trigger here. A Trusted repo's privileged steps are
# node root, and this repo is public: a PR's code must not reach them. Pull
# requests still get the GitHub Actions docker job. Run this by hand on any
# branch with Woodpecker's "Manual pipeline" to test changes before merging.
#
# Pushes to main also push registry.bobcob7.com/workspaces/ws-online:<sha7>-amd64;
# manifest.yaml merges both arches into <sha7>. The registry takes pushes
# without a login. Manual runs build and test but never push.
labels:
  platform: linux/amd64

when:
  - event: push
    branch: main
  - event: manual

services:
  # Named dind, not docker: Woodpecker appends its per-run service domain to the
  # step Pod's DNS search list AFTER bobcob7.com, so a bare name that matches a
  # *.bobcob7.com host (docker.bobcob7.com is the docker-mirror ingress)
  # resolves there instead of to this service.
  - name: dind
    image: docker:27-dind
    privileged: true
    ports: [2375, 18080]
    environment:
      # Plain tcp on the pipeline's own network; nothing else can reach it.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - woodpecker-dind-amd64:/var/lib/docker
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"
            memory: 2Gi

steps:
  - name: build
    image: docker:27-cli
    environment:
      DOCKER_HOST: tcp://dind:2375
    commands:
      - for i in $(seq 60); do docker info >/dev/null 2>&1 && break; echo "waiting for dind ($i)"; sleep 3; done
      - docker info | grep -E 'Server Version|Storage Driver|Backing Filesystem|Operating System|Architecture'
      - docker build -f deploy/docker/Dockerfile --build-arg VERSION=$(echo "$CI_COMMIT_SHA" | cut -c1-7) -t ws-online:ci .

  - name: smoke
    image: docker:27-cli
    depends_on: [build]
    environment:
      DOCKER_HOST: tcp://dind:2375
      SMOKE_HOST: dind
      SMOKE_BIND: 0.0.0.0
    commands:
      - apk add --no-cache bash curl jq
      - deploy/docker/smoke-test.sh ws-online:ci

  - name: push
    image: docker:27-cli
    depends_on: [smoke]
    environment:
      DOCKER_HOST: tcp://dind:2375
    commands:
      - tag=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - docker tag ws-online:ci registry.bobcob7.com/workspaces/ws-online:$tag-amd64
      - docker push registry.bobcob7.com/workspaces/ws-online:$tag-amd64
    when:
      - event: push
        branch: main
