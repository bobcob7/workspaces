# Scenarios: endpoint-failover, endpoint-repoint-no-tools (as endpoint A),
# config-invalid-mid-run. Two fake-ollama processes serve this file in
# endpoint-failover: A ([endpoints.fake]) and B ([endpoints.fake-b]).
# Turn 0's `sleep 2` gives the test time to fault A through the control
# API (and, in config-invalid-mid-run, to break config.toml) before the
# turn 1 request. A retried request has the same messages, so B answers
# the same turn A would have.
strict_capabilities: true
models:
  - {name: qwen/qwen3.5-9b, capabilities: [tools], context_length: 32768}
timing: {first_token: 10ms, chunk_interval: 1ms, words_per_chunk: 4}
rules:
  - turn: 0
    tool: run
    arguments: '{"command":"sleep 2 && echo slept"}'
  - turn: 1
    tool: write_file
    arguments: '{"path":"failover.txt","content":"written after the endpoint changed\n"}'
  - turn: 2
    tool: record_result
    arguments: '{"verdict":"PASS","report":"Slept, then wrote failover.txt."}'
