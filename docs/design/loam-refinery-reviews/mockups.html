<!doctype html>
<!--
  Static mockups for review reports in the desktop app (docs/design/loam-refinery-reviews).
  Open with a hash to pick a screen, e.g. mockups.html#report. The screenshots
  in img/ are rendered from this file at 1280x800; see README.md.
  Base styles are copied from ../desktop-sections/mockups.html; colors and type match desktop/src/index.css and theme.ts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review report mockups</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --panel: #161920;
  --panel-raised: #1d212a;
  --border: #2a2f3a;
  --text: #e3e6ec;
  --text-muted: #8d94a3;
  --accent: #58a6ff;
  --selected: #233047;
  --danger: #f85149;
  --status-working: #58a6ff;
  --status-needs-input: #f0a43a;
  --status-idle: #d8b04c;
  --status-done: #56c478;
  --status-stopped: #6e7681;
  --status-running: #a371f7;
  --font-mono: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.root { display: flex; flex-direction: column; height: 800px; width: 1280px; position: relative; }
.topBar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); min-height: 47px; }
.brand { font-weight: 700; font-size: 15px; }
.badge { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--status-needs-input) 18%, transparent); color: var(--status-needs-input); font-size: 12px; font-weight: 600; }
.spacer { flex: 1; }
.muted { color: var(--text-muted); font-size: 12px; }
.mono { font-family: var(--font-mono); }
.btn { border: 0; background: none; color: var(--accent); font: 600 13px/1 inherit; font-family: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.btn.outlined { border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding: 7px 10px; }
.btn.contained { background: var(--accent); color: #0b1220; }
.btn.danger { color: var(--danger); }
.btn.small { font-size: 12px; padding: 5px 8px; }
.body { flex: 1; display: flex; min-height: 0; }

/* Section rail */
.rail { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--border); background: var(--bg); }
.railItem { position: relative; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 7px; border-radius: 10px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
.railItem svg { width: 20px; height: 20px; }
.railItem.active { background: var(--selected); color: var(--text); }
.railItem.active::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.railCount { position: absolute; top: 3px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--status-needs-input); color: #1a1205; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.railCount.blue { background: var(--accent); color: #0b1220; }
.railSpacer { flex: 1; }

/* List pane */
.sidebar { width: 300px; flex: none; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.search { margin: 10px 12px 2px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 13px; background: var(--bg); }
.search svg { width: 14px; height: 14px; }
.list { overflow: hidden; padding: 8px 0 16px; }
.heading { display: flex; align-items: center; gap: 6px; margin: 0; padding: 8px 16px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.heading .count { font-weight: 500; opacity: 0.8; }
.group + .group { margin-top: 8px; }
.items { list-style: none; margin: 0; padding: 0 8px; }
.item { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 8px; }
.item.current { background: var(--selected); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.age { flex: none; color: var(--text-muted); font-size: 11px; }
.summary { padding-left: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); font-size: 12px; }
.summary.flush { padding-left: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--status-stopped); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.icon { width: 14px; height: 14px; flex: none; color: var(--text-muted); }
.icon.on { color: var(--accent); }

/* Detail pane */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.header { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.titleRow { display: flex; align-items: center; gap: 12px; }
.title { margin: 0; font-size: 18px; font-weight: 650; }
.title .prefix { color: var(--text-muted); font-weight: 500; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; color: var(--text-muted); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #2a303b; color: var(--text); font-size: 12px; }
.chip.link { background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.chip.warn { background: color-mix(in srgb, var(--status-needs-input) 18%, transparent); color: var(--status-needs-input); font-weight: 600; }
.chip.small { padding: 1px 6px; font-size: 11px; }
.content { flex: 1; overflow: hidden; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
.cardHead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
.cardBody { padding: 12px 14px; }
.toggleRow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.toggleRow + .toggleRow { border-top: 1px solid var(--border); }
.toggleText { flex: 1; }
.toggleText div:first-child { font-weight: 600; font-size: 13px; }
.switch { width: 34px; height: 20px; border-radius: 999px; background: #3a404c; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #c9ced8; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; background: #fff; }
.tabs { display: flex; align-items: center; gap: 4px; }
.tab { padding: 6px 10px; border-radius: 8px; color: var(--text-muted); font-weight: 600; font-size: 13px; }
.tab.active { background: var(--panel-raised); color: var(--text); }
.tab .n { opacity: 0.7; font-weight: 500; margin-left: 4px; }
.filter { margin-left: auto; width: 220px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 12px; background: var(--bg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
tr.hover td { background: var(--panel-raised); }
td.actions { text-align: right; }
.result { margin: 0; padding: 8px 10px; border-left: 3px solid var(--status-done); background: var(--panel-raised); border-radius: 0 6px 6px 0; }
.prose { color: var(--text); font-size: 13px; line-height: 1.55; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; }
.prose code { font-family: var(--font-mono); font-size: 12px; background: var(--panel-raised); padding: 1px 4px; border-radius: 4px; }
.cmd { font: 12px var(--font-mono); color: var(--text-muted); padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; }
.alert { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
.alert.info { background: color-mix(in srgb, var(--accent) 12%, transparent); color: #b9d8ff; }
.alert.warn { background: color-mix(in srgb, var(--status-needs-input) 14%, transparent); color: #f5cf95; }

/* Conversation stand-in for the Agents screen */
.convo { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.msg { max-width: 760px; font-size: 13px; line-height: 1.55; }
.msg.user { align-self: flex-end; background: var(--panel-raised); padding: 8px 12px; border-radius: 10px; }
.tool { font: 12px var(--font-mono); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: fit-content; }
.tool b { color: var(--text); }
.reply { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.reply .box { flex: 1; padding: 10px 12px; border: 1px solid #3a404c; border-radius: 8px; color: var(--text-muted); }

/* Dialog */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; }
.dialog { width: 600px; background: #1d212a; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.dialog h2 { margin: 0; padding: 18px 22px 6px; font-size: 18px; font-weight: 650; }
.dialog .dbody { padding: 10px 22px 6px; display: flex; flex-direction: column; gap: 16px; }
.dialog .dactions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; }
.field { position: relative; border: 1px solid #3a404c; border-radius: 8px; padding: 14px 12px 10px; font-size: 14px; }
.field label { position: absolute; top: -8px; left: 9px; padding: 0 4px; background: #1d212a; font-size: 12px; color: var(--text-muted); }
.field.focus { border: 2px solid var(--accent); }
.field.focus label { color: var(--accent); }
.field.multi { white-space: pre-wrap; line-height: 1.5; font-size: 13px; }
.fieldHint { margin-top: -10px; font-size: 12px; color: var(--text-muted); }
.fields { display: flex; gap: 12px; }
.fields .field { flex: 1; }

/* Settings */
.subnav { width: 220px; flex: none; border-right: 1px solid var(--border); background: var(--panel); padding: 12px 8px; }
.subnav .item { font-weight: 600; flex-direction: row; align-items: center; }
.settings { flex: 1; overflow: hidden; padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; max-width: 820px; }
.settings h1 { margin: 0; font-size: 20px; }
.setting { display: flex; gap: 24px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.setting .label { width: 260px; flex: none; }
.setting .label div:first-child { font-weight: 600; font-size: 13px; }
.setting .control { flex: 1; display: flex; align-items: center; gap: 10px; }
.input { padding: 7px 10px; border: 1px solid #3a404c; border-radius: 8px; font-size: 13px; background: var(--bg); }
.textarea { width: 100%; padding: 10px; border: 1px solid #3a404c; border-radius: 8px; font: 12px/1.55 var(--font-mono); background: var(--bg); white-space: pre-wrap; }
.check { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #6b7280; flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); position: relative; }
.check.on::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px; border: solid #0b1220; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.empty { flex: 1; display: grid; place-items: center; padding: 24px; color: var(--text-muted); text-align: center; }

/* ---------- Review report (loam-refinery) ---------- */
.content.tight { gap: 10px; padding: 12px 18px 0; }
.profiles { display: flex; gap: 8px; flex-wrap: wrap; }
.prof { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 12px; }
.prof b { font-weight: 650; font-size: 12.5px; }
.prof .v { font-weight: 600; }
.prof.missing { border-style: dashed; color: var(--text-muted); }
.prof.pending { border-style: dashed; }
.v.rc { color: var(--danger); } .v.cm { color: var(--status-idle); } .v.ok { color: var(--status-done); }
.filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fchip { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
.fchip.on { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.findings { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.band { display: flex; align-items: center; gap: 8px; padding: 10px 2px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.band .bar { width: 10px; height: 10px; border-radius: 3px; }
.finding { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.finding + .finding { margin-top: 6px; }
.fhead { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-width: 0; }
.prio { flex: none; width: 24px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 12px var(--font-mono); }
.p-must { background: color-mix(in srgb, var(--danger) 22%, transparent); color: #ff9b95; }
.p-should { background: color-mix(in srgb, var(--status-needs-input) 22%, transparent); color: #f5c47c; }
.p-worth { background: color-mix(in srgb, var(--accent) 18%, transparent); color: #9cc8ff; }
.p-opt { background: #2a303b; color: var(--text-muted); }
.ftitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; }
.fid { flex: none; font: 11.5px var(--font-mono); color: var(--text-muted); }
.floc { flex: none; font: 11.5px var(--font-mono); color: var(--accent); }
.seg { display: inline-flex; flex: none; border: 1px solid #3a404c; border-radius: 7px; overflow: hidden; }
.seg span { padding: 4px 9px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.seg span + span { border-left: 1px solid #3a404c; }
.seg .on-comment { background: color-mix(in srgb, var(--accent) 22%, transparent); color: #b9d8ff; }
.seg .on-fix { background: color-mix(in srgb, var(--status-done) 22%, transparent); color: #a6e3b8; }
.seg .on-skip { background: #2f3540; color: var(--text); }
.fbody { padding: 0 12px 12px 44px; display: flex; flex-direction: column; gap: 10px; }
.code { margin: 0; font: 12px/1.5 var(--font-mono); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre; overflow: hidden; }
.code .ln { color: #5b6270; display: inline-block; width: 28px; }
.code .k { color: #ff7b72; } .code .s { color: #a5d6ff; } .code .f { color: #d2a8ff; } .code .c { color: #8b949e; }
.suggs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sugg { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.sugg.chosen { border: 2px solid var(--status-done); padding: 7px 9px; }
.sugg .shead { display: flex; align-items: flex-start; gap: 8px; font-weight: 600; }
.radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #6b7280; flex: none; margin-top: 2px; }
.radio.on { border-color: var(--status-done); box-shadow: inset 0 0 0 3px #1d212a; background: var(--status-done); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: var(--text-muted); font-size: 12px; }
.pc div::before { font-weight: 700; margin-right: 4px; }
.pc .pro::before { content: "+"; color: var(--status-done); }
.pc .con::before { content: "−"; color: var(--danger); }
.done { font-size: 12px; font-weight: 600; color: var(--status-done); flex: none; }
.decided { font-size: 11px; color: var(--text-muted); flex: none; }
.actionBar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--border); background: var(--panel); }
.tally { display: flex; gap: 12px; font-size: 12.5px; color: var(--text-muted); }
.tally b { color: var(--text); }
.mini { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; }
.dialog.wide { width: 860px; }
.pv { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pvHead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--border); font: 12px var(--font-mono); color: var(--text-muted); }
.pvBody { padding: 8px 12px; font-size: 13px; line-height: 1.5; }
.pvBody .foot { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }
.radioRow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
.radioRow.sel { border: 2px solid var(--accent); padding: 9px 11px; }
.radioRow .t { font-weight: 600; font-size: 13px; }
.steps { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.step { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const icons = {
  agents: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>',
  repos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6"/><path d="M18 10.2c0 4-6 3.5-11.2 7"/></svg>',
  reviews: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M6 7.2v9.6"/><path d="M18 16.8V9a3 3 0 0 0-3-3h-4"/><path d="M13 3.5 10.5 6 13 8.5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};

const rail = (active, counts = {}) => {
  const item = (key, label) => `
    <div class="railItem ${active === key ? "active" : ""}">
      ${icons[key]}<span>${label}</span>
      ${counts[key] ? `<span class="railCount ${key === "reviews" ? "blue" : ""}">${counts[key]}</span>` : ""}
    </div>`;
  return `<nav class="rail">${item("agents", "Agents")}${item("repos", "Repos")}${item("reviews", "Reviews")}<div class="railSpacer"></div>${item("settings", "Settings")}</nav>`;
};

const counts = { agents: 2, reviews: 3 };

const topBar = (actions) => `
  <header class="topBar">
    <span class="brand">Workspaces</span>
    <span class="badge">2 waiting for you</span>
    <span class="spacer"></span>
    ${actions}
  </header>`;

const dot = (color) => `<span class="dot" style="background:${color}"></span>`;

const listItem = ({ name, age, summary, color, current, trailing = "" }) => `
  <li class="item ${current ? "current" : ""}">
    <div class="row">${color ? dot(color) : ""}<span class="name">${name}</span>${trailing}<span class="age">${age}</span></div>
    <div class="summary ${color ? "" : "flush"}">${summary}</div>
  </li>`;

const group = (title, items) => `
  <div class="group">

const tab = (label, n, active) => `<span class="tab ${active ? "active" : ""}">${label}${n != null ? `<span class="n">${n}</span>` : ""}</span>`;

const bandOf = (p) => (p >= 9 ? "p-must" : p >= 7 ? "p-should" : p >= 4 ? "p-worth" : "p-opt");

const seg = (d) => `<span class="seg"><span class="${d === "comment" ? "on-comment" : ""}">Comment</span><span class="${d === "fix" ? "on-fix" : ""}">Fix</span><span class="${d === "skip" ? "on-skip" : ""}">Skip</span></span>`;

const finding = ({ p, title, id, loc, d, open, body, code, suggs, done, decided, readonly }) => `
  <div class="finding" style="${readonly ? "opacity:.6" : ""}">
    <div class="fhead">
      <span class="prio ${bandOf(p)}">${p}</span>
      <span class="ftitle" style="${open ? "white-space:normal" : ""}">${title}</span>
      <span class="fid">${id}</span>
      ${loc ? `<span class="floc">${loc}</span>` : ""}
      ${decided ? `<span class="decided">${decided}</span>` : ""}
      ${done ? `<span class="done">${done}</span>` : readonly ? `<span class="decided">read-only</span>` : seg(d)}
    </div>
    ${open ? `<div class="fbody">
      <div class="prose" style="margin:0">${body}</div>
      ${code ? `<pre class="code">${code}</pre>` : ""}
      ${suggs ? `<div class="suggs">${suggs.map((s) => `
        <div class="sugg ${s.on ? "chosen" : ""}">
          <div class="shead"><span class="radio ${s.on ? "on" : ""}"></span><span style="flex:1">${s.summary}</span></div>
          <div class="row" style="gap:6px"><span class="chip small">effort: ${s.effort}</span><span class="chip small">scope: ${s.scope}</span></div>
          <div class="pc"><div class="pro">${s.pro}</div><div class="con">${s.con}</div></div>
        </div>`).join("")}</div>` : ""}
    </div>` : ""}
  </div>`;

const band = (label, color, n) => `<div class="band"><span class="bar" style="background:${color}"></span>${label}<span class="count" style="font-weight:500">${n}</span></div>`;

const prof = (name, verdict, cls, detail, extra = "") => `<div class="prof ${extra}"><b>${name}</b><span class="v ${cls}">${verdict}</span><span class="muted">${detail}</span></div>`;

        <div class="setting"><div class="label"><div>Model and permission mode</div><div class="muted">The review agent runs <span class="mono">loam-refinery</span> and <span class="mono">git</span>; allow them in Claude Code's permissions, or it waits for you.</div></div><div class="control"><span class="input">Default ▾</span><span class="input">default ▾</span></div></div>
      </div></main>
    </div>
  </div>`;

const screens = {
  report: () => reportScreen("", false),
  "report-finding": () => reportScreen(),
  "report-comment": () => reportScreen(commentDialog()),
  "report-fix": () => reportScreen(fixDialog()),
  "report-reviewing": reviewingScreen,
  "report-outdated": outdatedScreen,
  "report-requester": requesterScreen,
  "report-settings": settingsScreen,
};

const render = () => {
  const key = location.hash.slice(1) || "report";
  document.getElementById("app").innerHTML = (screens[key] ?? screens.report)();
};
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
