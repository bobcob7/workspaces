# Scenario: endpoint-down-mid-run. edit-file's turns, except turn 1's run
# sleeps so the test can fault the endpoint before turn 2's request.
strict_capabilities: true
tokens_per_word: 4
models:
  - {name: qwen/qwen3.5-9b, capabilities: [tools], context_length: 32768}
timing: {first_token: 10ms, chunk_interval: 1ms, words_per_chunk: 4}
rules:
  - turn: 0
    tool: write_file
    arguments: '{"path":"hello.txt","content":"hello from the fake model\n"}'
  - turn: 1
    tool: run
    arguments: '{"command":"sleep 2 && git add hello.txt && git -c user.name=fake -c user.email=fake@example.com commit -q -m \"feat: add hello\" && git log --oneline -1"}'
  - turn: 2
    tool: record_result
    arguments: '{"verdict":"PASS","report":"Wrote hello.txt and committed it."}'
