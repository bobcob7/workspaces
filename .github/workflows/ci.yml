name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: make test
      - run: make build

  # Each OS lints its own build-tagged files, such as internal/proc.
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: make lint

  # ADR 0067: the runner's scenarios against the fakes, on loopback only.
  e2e-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: make e2e-runner

  # ADR 0053: the Workspace Online image builds and starts; nothing is pushed.
  # Built natively on both architectures: the published image is multi-arch.
  docker:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: ws-online:ci
          cache-from: type=gha,scope=${{ matrix.os }}
          cache-to: type=gha,mode=max,scope=${{ matrix.os }}
      - run: deploy/docker/smoke-test.sh ws-online:ci

  # ADR 0081: Windows builds, vets and lints from Linux; the tests run in
  # the windows job below.
  windows-cross:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: GOOS=windows GOARCH=${{ matrix.arch }} go build ./...
      - run: GOOS=windows GOARCH=${{ matrix.arch }} go vet ./...
      - run: mkdir -p "$RUNNER_TEMP/wt" && GOOS=windows GOARCH=${{ matrix.arch }} go test -c -o "$RUNNER_TEMP/wt/" ./...
      # go tool builds the linter for the target OS, so build it for the host first.
      - name: golangci-lint on the Windows files
        if: matrix.arch == 'amd64'
        run: |
          L=$(GOOS= GOARCH= go tool -n golangci-lint)
          GOOS=windows "$L" run ./...

  # ADR 0081: the Windows tests. make test-windows is the required set; the
  # full suite is informational until its failures are sorted out.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: make test-windows
      - name: full suite (informational)
        if: always()
        continue-on-error: true
        run: go test -p 2 ./...

  # ADR 0086: a ws.exe for every pull request and every push to main, to try the branch on Windows.
  # Download it from the run's Artifacts, or gh run download <id> -n ws-windows-amd64.
  windows-exe:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags for main.version
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - run: make windows-exe WINARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ws-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/ws.exe
          if-no-files-found: error
          retention-days: 14
